
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed AI - Mali & Afrique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        theme: {
                            primary: 'var(--theme-primary)',
                            secondary: 'var(--theme-secondary)',
                            accent: 'var(--theme-accent)',
                            bg: 'var(--theme-bg)',
                            surface: 'var(--theme-surface)',
                            text: 'var(--theme-text)',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-primary: #15803d;
            --theme-secondary: #166534;
            --theme-accent: #f59e0b;
            --theme-bg: #f8fafc;
            --theme-surface: #ffffff;
            --theme-text: #0f172a;
        }

        .dark {
            --theme-bg: #020617;
            --theme-surface: #0f172a;
            --theme-text: #f8fafc;
            --theme-primary: #10b981;
        }

        .theme-sahara {
            --theme-primary: #d97706;
            --theme-secondary: #92400e;
            --theme-accent: #fbbf24;
            --theme-bg: #fffbeb;
            --theme-surface: #fef3c7;
            --theme-text: #451a03;
        }
        .dark.theme-sahara {
            --theme-bg: #451a03;
            --theme-surface: #78350f;
            --theme-text: #fef3c7;
        }

        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Animation Ressort / Spring pour les messages */
        @keyframes message-bloom {
          0% { opacity: 0; transform: translateY(20px) scale(0.95) skewX(-1deg); filter: blur(10px); }
          60% { transform: translateY(-5px) scale(1.02) skewX(0deg); filter: blur(0px); }
          100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
        }

        /* Aura de réflexion spirituelle */
        @keyframes spirit-pulse {
          0%, 100% { box-shadow: 0 0 0px 0px rgba(245, 158, 11, 0); transform: scale(1); }
          50% { box-shadow: 0 0 30px 10px rgba(245, 158, 11, 0.3); transform: scale(1.05); }
        }

        /* Flottaison douce des particules */
        @keyframes float-particle {
          0% { transform: translateY(0) rotate(0deg); opacity: 0; }
          20% { opacity: 0.5; }
          80% { opacity: 0.5; }
          100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Dégradé mouvant */
        @keyframes mesh-drift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .animate-message-bloom { animation: message-bloom 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-spirit-pulse { animation: spirit-pulse 2s infinite ease-in-out; }
        .particle { position: absolute; pointer-events: none; animation: float-particle linear infinite; }
        
        .shimmer-effect::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 60%;
          height: 100%;
          background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
          animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
          0% { transform: translateX(-150%) skewX(-20deg); }
          100% { transform: translateX(150%) skewX(-20deg); }
        }

        .bg-mesh-anim {
          background-size: 200% 200%;
          animation: mesh-drift 15s ease infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="transition-colors duration-300 bg-theme-bg text-theme-text overflow-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
